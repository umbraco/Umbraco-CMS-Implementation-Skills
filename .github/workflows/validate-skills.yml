name: Validate skills

# Deterministic, model-free proof that skill output compiles and serves the right HTTP
# responses: each skill's example project is compiled into the reference instance, which
# Umbraco-CMS.Skills.TestHost boots in-process (WebApplicationFactory) and asserts over HTTP.

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Pinned explicitly rather than relying on the runner image's default, because the BUILD
      # depends on it: plugins/Directory.Build.props shells out to node to project each skill's
      # assets/ into obj/. No install step — the scripts use nothing beyond Node's stdlib.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Examples are generated from assets/ at build time, so they cannot drift and there is
      # nothing to diff. What CAN still go wrong is a placeholder an asset carries but its
      # manifest doesn't declare: it survives substitution as a literal string, still compiles,
      # and silently never matches. This catches that before the build. Skills whose assets/
      # aren't present on this branch are skipped, so it's safe pre-merge.
      - name: Placeholders declared for every asset
        run: node scripts/generate-examples.mjs --lint

      - name: Restore
        run: dotnet restore Umbraco-CMS.Skills.sln

      - name: Build
        run: dotnet build Umbraco-CMS.Skills.sln --no-restore -c Debug

      # The two hosts are tested as SEPARATE `dotnet test` invocations, not as one solution-wide run.
      # Umbraco's StaticServiceProvider is process-wide static state, so a second host booted in the
      # same process leaves the first one's code resolving from a dead provider. Test assemblies
      # should already get their own processes, but that's a VSTest implementation detail and this
      # gate is too load-bearing to rest on it — invoking per project makes the isolation explicit.
      # (UmbracoHostSentinel is the tripwire if it ever stops holding.)

      # Site 1 — the Clean host: approaches implemented as C# that registers into DI.
      - name: Test site 1 (Clean host)
        run: dotnet test Umbraco-CMS.Skills.TestHost/Umbraco-CMS.Skills.TestHost.csproj --no-build -c Debug --logger "console;verbosity=normal"

      # Site 2 — no starter kit: approaches implemented as Document Types + templates + config, whose
      # content is seeded by each example's own package migration.
      - name: Test site 2 (no starter kit)
        run: dotnet test Umbraco-CMS.Skills.TestHost.Blank/Umbraco-CMS.Skills.TestHost.Blank.csproj --no-build -c Debug --logger "console;verbosity=normal"
